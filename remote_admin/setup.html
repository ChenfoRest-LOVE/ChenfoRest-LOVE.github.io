<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>设置管理员 · Forest</title><link rel="stylesheet" href="/admin.css"><script src="/setup.js" defer></script></head>
<body><main><header><span class="wordmark">FOREST.</span><span class="back">首次设置</span></header><section class="account-panel"><p class="eyebrow">PRIVATE / INITIAL SETUP</p><h1>设置管理员</h1><p class="intro">此页面通过 SSH 加密通道连接你的服务器。设置完成后自动关闭，不开放注册。</p><form id="setup-form"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]{3,40}" required disabled><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="14" maxlength="128" required disabled><p class="hint">14–128 位。建议使用密码管理器生成并保存。</p><label for="confirm">确认密码</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required disabled><button type="submit" disabled>创建管理员</button></form></section><p id="status" class="status" role="status" aria-live="polite">正在连接…</p><noscript><p>设置账号需要启用 JavaScript。</p></noscript><footer>FOREST / PERSONAL ARCHIVE</footer></main></body></html>

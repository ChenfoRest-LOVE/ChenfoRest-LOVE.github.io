server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/chenforest/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/chenforest-access.log;
    error_log /var/log/nginx/chenforest-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /__revision {
        alias /var/www/chenforest/current/.release-revision;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:css|js|jpe?g|png|webp|avif|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/chenforest/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/chenforest-access.log;
    error_log /var/log/nginx/chenforest-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /__revision {
        alias /var/www/chenforest/current/.release-revision;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:css|js|jpe?g|png|webp|avif|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# Domain HTTP traffic uses the canonical HTTPS address. Keep IP access and
# the local publish-script health check on the default HTTP server above.
server {
    listen 80;
    listen [::]:80;
    server_name denss.asia www.denss.asia;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/chenforest-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://denss.asia$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name denss.asia www.denss.asia;
    root /var/www/chenforest/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/denss.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denss.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:chenforest_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Keep credentials and the host-only session cookie on one HTTPS origin.
    if ($host = www.denss.asia) { return 301 https://denss.asia$request_uri; }

    access_log /var/log/nginx/chenforest-access.log;
    error_log /var/log/nginx/chenforest-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /admin { return 308 https://denss.asia/admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:6190;
        proxy_set_header Host denss.asia;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        client_max_body_size 4k;
        access_log off;
    }
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:6190;
        proxy_set_header Host denss.asia;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
        client_max_body_size 4k;
        access_log off;
    }
    location = /api/covers {
        proxy_pass http://127.0.0.1:6190;
        proxy_set_header Host denss.asia;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
        access_log off;
    }

    location = /__revision {
        alias /var/www/chenforest/current/.release-revision;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:css|js|jpe?g|png|webp|avif|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires -1;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
